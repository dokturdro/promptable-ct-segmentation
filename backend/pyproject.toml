[project]
name = "promptable-seg-backend"
version = "0.1.0"
description = "Promptable CT segmentation demo backend (DICOMweb + DICOM-SEG). Not for clinical use."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.160",
    "uvicorn[standard]>=0.54",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "pydicom>=3.0.2",
    "highdicom>=0.28.2",
    "dicomweb-client>=0.61",
    "SimpleITK>=2.5",
    "nibabel>=5.4",
    "numpy>=2",
    "scipy>=1.14",
    "torch==2.14.1",
    "torchvision",
    "totalsegmentator==2.18.0",
    # MedSAM2 (code Apache-2.0; weights CC-BY-SA-4.0, research/education only). Installs `sam2`.
    "medsam2",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "setuptools>=61",
]

[dependency-groups]
dev = ["ruff>=0.17", "pytest>=9"]
seed = ["idc-index>=0.13.4"]

[tool.uv]
default-groups = ["dev", "seed"]
# Build MedSAM2 against the venv's CUDA torch (not a second CPU torch in an isolated env)
# and skip its optional CUDA extension, which doesn't build on Windows without nvcc.
no-build-isolation-package = ["medsam2"]
extra-build-variables = { medsam2 = { SAM2_BUILD_CUDA = "0" } }

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
medsam2 = { git = "https://github.com/bowang-lab/MedSAM2", rev = "332f30d420f1d1b08e2a79b3ae6a602458808383" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
